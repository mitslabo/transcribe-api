services:
  transcribe-api:
    build:
      context: .
      args:
        - HTTP_PROXY=$HTTP_PROXY
        - HTTPS_PROXY=$HTTPS_PROXY
        - NO_PROXY=$NO_PROXY
    # Configure proxy settings for the running container.
    environment:
      PORT: "8080"
      WHISPER_SERVER_URL: "${WHISPER_SERVER_URL:-http://host.docker.internal:8081/v1}"
      WHISPER_API_KEY: "${WHISPER_API_KEY:-}"
      MERGED_AUDIO_DIR: "${MERGED_AUDIO_DIR}"
      HTTP_PROXY: "${HTTP_PROXY:-}"
      HTTPS_PROXY: "${HTTPS_PROXY:-}"
      NO_PROXY: "${NO_PROXY:-}"
    ports:
      - "${PORT:-8080}:8080"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - "${RAW_AUDIO_DIR}:${RAW_AUDIO_DIR}"
      - "${MERGED_AUDIO_DIR}:${MERGED_AUDIO_DIR}"
    restart: unless-stopped
